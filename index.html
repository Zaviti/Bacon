<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Pulso — Feed Social</title>
<meta name="description" content="Pulso: compartilhe momentos com sua comunidade, pensado para uso com uma mão só." />
<meta name="theme-color" content="#12121A" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pulso" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Skip link para acessibilidade -->
<a class="skip-link" href="#main">Pular para o conteúdo</a>

<div class="app-shell">

  <!-- Barra de topo: minimalista, sem ações críticas (fora da zona do polegar de propósito) -->
  <header class="topbar" role="banner">
    <div class="topbar__brand">
      <span class="pulse-dot" aria-hidden="true"></span>
      <span class="topbar__title">Pulso</span>
    </div>
    <button class="icon-btn" id="btn-search-top" aria-label="Buscar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </header>

  <!-- MAIN: cada view é uma section, alternadas via JS -->
  <main id="main" class="views" role="main">

    <!-- FEED -->
    <section class="view view--active" id="view-feed" aria-labelledby="feed-heading">
      <h1 id="feed-heading" class="visually-hidden">Seu feed</h1>

      <div class="stories" id="stories" aria-label="Destaques"></div>

      <div class="composer-hint" id="composer-hint">
        <div class="composer-hint__avatar" aria-hidden="true">V</div>
        <button class="composer-hint__field" id="btn-open-composer-hint">
          No que você está pensando?
        </button>
      </div>

      <div class="feed" id="feed-list" aria-live="polite"></div>

      <div class="feed-end" id="feed-end">
        <span class="pulse-dot pulse-dot--sm" aria-hidden="true"></span>
        Você chegou ao fim por agora
      </div>
    </section>

    <!-- BUSCA -->
    <section class="view" id="view-search" aria-labelledby="search-heading">
      <h1 id="search-heading" class="view-title">Buscar</h1>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search-input" placeholder="Buscar pessoas, tags ou palavras" aria-label="Buscar" />
      </div>
      <div class="chips" id="search-chips"></div>
      <div class="feed" id="search-results"></div>
    </section>

    <!-- ATIVIDADE -->
    <section class="view" id="view-activity" aria-labelledby="activity-heading">
      <h1 id="activity-heading" class="view-title">Atividade</h1>
      <div class="activity-list" id="activity-list"></div>
    </section>

    <!-- PERFIL -->
    <section class="view" id="view-profile" aria-labelledby="profile-heading">
      <div class="profile-header">
        <div class="profile-avatar" aria-hidden="true">V</div>
        <div>
          <h1 id="profile-heading" class="profile-name">Você</h1>
          <p class="profile-handle">@voce.pulso</p>
        </div>
      </div>
      <div class="profile-stats">
        <div class="stat"><strong id="stat-posts">0</strong><span>posts</span></div>
        <div class="stat"><strong id="stat-followers">128</strong><span>seguidores</span></div>
        <div class="stat"><strong id="stat-following">96</strong><span>seguindo</span></div>
      </div>
      <div class="profile-grid" id="profile-grid" aria-label="Suas postagens"></div>
    </section>

  </main>

  <!-- ZONA DO POLEGAR: navegação inferior fixa + FAB central -->
  <nav class="bottom-nav" role="navigation" aria-label="Navegação principal">
    <button class="nav-item nav-item--active" data-view="feed" aria-current="page">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Início</span>
    </button>

    <button class="nav-item" data-view="search">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Buscar</span>
    </button>

    <!-- FAB de "Adicionar Postagem": centralizado, elevado, alcance imediato do polegar -->
    <div class="fab-slot">
      <button class="fab" id="btn-add-post" aria-label="Adicionar postagem">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#12121A" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <button class="nav-item" data-view="activity">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      <span class="nav-badge-wrap">Atividade<span class="nav-badge" id="activity-badge" hidden></span></span>
    </button>

    <button class="nav-item" data-view="profile">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6.5 8-6.5s6.5 2 8 6.5"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

</div>

<!-- MODAL: Adicionar Postagem — aberto pelo FAB, fecha por baixo (thumb-friendly) -->
<div class="sheet-backdrop" id="composer-backdrop" hidden>
  <div class="sheet" id="composer-sheet" role="dialog" aria-modal="true" aria-labelledby="composer-title">
    <div class="sheet__handle" aria-hidden="true"></div>
    <div class="sheet__header">
      <button class="sheet__cancel" id="btn-cancel-post">Cancelar</button>
      <h2 class="sheet__title" id="composer-title">Nova postagem</h2>
      <button class="sheet__submit" id="btn-submit-post" disabled>Publicar</button>
    </div>
    <div class="sheet__body">
      <div class="composer-user">
        <div class="composer-hint__avatar" aria-hidden="true">V</div>
        <span>Você · <small>público</small></span>
      </div>
      <textarea id="post-text" class="composer-textarea" placeholder="No que você está pensando?" maxlength="280" rows="4"></textarea>
      <div class="composer-preview" id="composer-preview" hidden>
        <img id="composer-preview-img" alt="Pré-visualização da imagem selecionada" />
        <button class="composer-preview__remove" id="btn-remove-image" aria-label="Remover imagem">✕</button>
      </div>
      <div class="composer-count"><span id="char-count">0</span>/280</div>
    </div>
    <!-- Barra de ações do composer também na base: alcance do polegar dentro do modal -->
    <div class="sheet__actions">
      <label class="sheet__action-btn" for="post-image-input">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        Foto
      </label>
      <input type="file" id="post-image-input" accept="image/*" hidden />
      <button class="sheet__action-btn" id="btn-add-location" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="location-label">Local</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast de feedback -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
